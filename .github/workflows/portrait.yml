name: Portrait

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "me.jpg"
      - "scripts/dotify.py"
      - ".github/workflows/portrait.yml"

permissions:
  contents: write

jobs:
  portrait:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Generate portrait
        run: |
          python scripts/dotify.py me.jpg -o assets/portrait --circle

      - name: Commit portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait-dark.svg assets/portrait-light.svg
          git diff --staged --quiet || git commit -m "chore: generate portrait"
          git push
